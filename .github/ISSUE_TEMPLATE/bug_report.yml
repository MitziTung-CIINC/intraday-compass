name: 问题反馈
description: 帮助复现启动、行情或界面问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿提交证券账户、手机号、资金、交易密码、访问令牌或其他敏感信息。
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Node.js 版本和浏览器
      placeholder: Windows 11 / Node.js 22 / Chrome
    validations:
      required: true
  - type: input
    id: symbol
    attributes:
      label: 股票代码
      description: 可选，只填写公开的6位股票代码
      placeholder: "600519"
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 启动项目 2. 添加股票 3. 点击……
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果与错误文字
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认反馈中不含账户、资金、密码或令牌。
          required: true
